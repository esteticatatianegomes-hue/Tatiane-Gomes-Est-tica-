<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatiane Gomes Estética | Links Úteis</title>
    <meta name="description" content="Acesse os canais oficiais, agendamentos e tratamentos de Tatiane Gomes Estética.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons para ícones elegantes em vetor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --color-dark-green: #234236;
            --color-moss-green: #2E5344;
            --color-gold: #C5A46D;
            --color-off-white: #F8F6F2;
            --color-white: #FFFFFF;
            --font-title: 'Playfair Display', Georgia, serif;
            --font-text: 'Montserrat', sans-serif;
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-text);
            background-color: #0b1511; /* Fundo escuro premium */
            background-image: radial-gradient(circle at 50% 0%, #234236 0%, #0b1511 75%);
            color: var(--color-off-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 3rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Textura Discreta */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .linktree-container {
            width: 100%;
            max-width: 580px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 1rem;
        }

        .linktree-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .linktree-logo-wrapper {
            position: relative;
            margin-bottom: 1.2rem;
            display: inline-block;
        }

        .linktree-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--color-gold);
            box-shadow: 0 0 25px rgba(197, 164, 109, 0.35);
        }

        .linktree-title {
            font-family: var(--font-title);
            font-size: 1.7rem;
            font-weight: 500;
            letter-spacing: 3px;
            color: var(--color-off-white);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        .linktree-subtitle {
            font-size: 0.88rem;
            letter-spacing: 1px;
            color: var(--color-gold);
            font-weight: 500;
        }

        .linktree-links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .link-card {
            position: relative;
            width: 100%;
            height: 84px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            background: linear-gradient(135deg, #0e1e17 0%, #1d362d 50%, #0e1e17 100%);
            background-size: 200% 200%;
            transition: var(--transition-smooth);
            border: 1.5px solid rgba(197, 164, 109, 0.2);
        }

        .link-card:hover {
            transform: translateY(-4px) scale(1.015);
            box-shadow: 0 15px 35px rgba(197, 164, 109, 0.3);
            border-color: rgba(197, 164, 109, 0.7);
            background-position: right center;
        }

        .link-card-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            width: 100%;
            padding: 0 2rem;
            gap: 1.5rem;
            color: var(--color-white);
        }

        .link-card-content i {
            font-size: 1.8rem;
            color: var(--color-gold);
            transition: transform 0.4s ease;
            opacity: 0.95;
            width: 32px;
            display: flex;
            justify-content: center;
        }

        .link-card:hover .link-card-content i {
            transform: scale(1.1);
            color: var(--color-white);
        }

        .link-card-content span {
            font-family: var(--font-title);
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            body {
                padding: 2.5rem 1rem;
            }

            .linktree-logo {
                width: 95px;
                height: 95px;
            }
            
            .linktree-title {
                font-size: 1.45rem;
                letter-spacing: 2px;
            }
            
            .link-card {
                height: 76px;
            }
            
            .link-card-content {
                padding: 0 1.5rem;
                gap: 1.1rem;
            }

            .link-card-content i {
                font-size: 1.5rem;
                width: 24px;
            }
            
            .link-card-content span {
                font-size: 0.92rem;
                letter-spacing: 1.5px;
            }
        }
    </style>
</head>
<body class="linktree-body">
    <div class="noise-overlay"></div>

    <div class="linktree-container">
        <header class="linktree-header">
            <div class="linktree-logo-wrapper">

            </div>
            <h1 class="linktree-title">Tatiane Gomes</h1>
            <p class="linktree-subtitle">SAÚDE ESTÉTICA • SANTO AMARO</p>
        </header>

        <div class="linktree-links">

            <!-- TATIANE GOMES ESTÉTICA -->
            <a href="home.html" class="link-card">
                <div class="link-card-content">
                    <i class="ph ph-house"></i>
                    <span>Tatiane Gomes Estética</span>
                </div>
            </a>

            <!-- SLIM ONE -->
            <a href="slim-one.html" class="link-card">
                <div class="link-card-content">
                    <i class="ph ph-sparkles"></i>
                    <span>Slim One</span>
                </div>
            </a>

            <!-- TRATAMENTOS CORPORAIS -->
            <a href="tratamentos-corporais.html" class="link-card">
                <div class="link-card-content">
                    <i class="ph ph-leaf"></i>
                    <span>Tratamentos Corporais</span>
                </div>
            </a>

            <!-- TRATAMENTOS FACIAIS -->
            <a href="tratamentos-faciais.html" class="link-card">
                <div class="link-card-content">
                    <i class="ph ph-sparkle"></i>
                    <span>Tratamentos Faciais</span>
                </div>
            </a>

            <!-- CONTATO -->
            <a href="contato.html" class="link-card">
                <div class="link-card-content">
                    <i class="ph ph-chat-circle"></i>
                    <span>Contato</span>
                </div>
            </a>

            <!-- CONHEÇA O MEU PODCAST -->
            <a href="https://friendly-duckanoo-f468fe.netlify.app/site" class="link-card" target="_blank" rel="noopener">
                <div class="link-card-content">
                    <i class="ph ph-microphone"></i>
                    <span>Conheça o meu Podcast</span>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
